# Fly.io config for the game server: ONE always-on machine in London that holds every room in
# memory and keeps each WebSocket open all night. The site itself stays on Vercel, whose
# production build points the client here (VITE_GAME_SERVER in vercel.json).
#
# One machine, never two: rooms live in this process's memory (no REDIS_URL), so a second machine
# would split the players of a room between them. The deploy workflow passes --ha=false and
# scales to one; never `fly scale count 2` without adding a Redis first.
#
# Deploys come from .github/workflows/deploy-fly.yml once the FLY_API_TOKEN repository secret
# exists (the first run creates the app). By hand: `fly deploy --ha=false`. A deploy restarts the
# process; the games in progress carry on afterwards from the checkpoints the phones hold (sealed
# with the ROOM_CHECKPOINT_KEY secret, which the workflow creates once), and the workflow still only
# runs for server-side changes.
app = "boredgames-io"
primary_region = "lhr"
# On a deploy the server sends every phone a fresh checkpoint and a "restarting" close, then exits:
# well under a second, and it exits by itself after 3 s at most.
kill_signal = "SIGTERM"
kill_timeout = "10s"
# Headroom for a spike instead of an out-of-memory kill, which would end every room.
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  # The admin dashboard (docs/ADMIN.md): its host, and the analytics kept on the volume below.
  # ADMIN_PASSWORD is a secret the owner sets; ADMIN_SESSION_KEY is made once by the deploy workflow.
  ADMIN_HOST = "admin.boredgames.io"
  ANALYTICS_DB = "/data/analytics.db"

# One 1 GB volume in lhr for the analytics (the deploy workflow creates it when it is missing).
# Rooms never touch it: they still live in memory.
[mounts]
  source = "bg_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  # Always on: a stopped machine drops every room (a party on a break included) and makes the
  # first player of the evening wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every player holds a WebSocket open all night; Fly's default of 25 connections a machine
  # would turn a second party away.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
